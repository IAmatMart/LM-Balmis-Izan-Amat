<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validación formulario</title>
</head>
<body>

<h2>Formulario</h2>

<form id="formulario">

    <label>Usuario:</label>
    <input type="text" id="usuario"><br><br>

    <label>Contraseña:</label>
    <input type="password" id="pass1"><br><br>

    <label>Repetir contraseña:</label>
    <input type="password" id="pass2"><br><br>

    <label>Nombre:</label>
    <input type="text" id="nombre"><br><br>

    <label>Apellidos:</label>
    <input type="text" id="apellidos"><br><br>

    <label>Teléfono:</label>
    <input type="text" id="telefono"><br><br>

    <button type="submit">Enviar</button>

</form>

<script src="validacion.js"></script>

</body>
</html>
